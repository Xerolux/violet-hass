name: Validate Integration

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/violet_pool_controller/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'CLAUDE.md'
      - 'hacs.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tox.ini'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect release changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check package paths
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || \
             git diff --name-only "$BEFORE" "${{ github.sha }}" \
               | grep -Eq '^(custom_components/violet_pool_controller/|scripts/build_release\.py$)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare all version sources
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          component = Path("custom_components/violet_pool_controller")
          manifest_version = json.loads((component / "manifest.json").read_text())["version"]

          const_text = (component / "const.py").read_text()
          const_match = re.search(r'^INTEGRATION_VERSION = "([^"]+)"$', const_text, re.MULTILINE)
          if const_match is None:
              raise SystemExit("INTEGRATION_VERSION is missing from const.py")

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          versions = {
              "manifest.json": manifest_version,
              "const.py": const_match.group(1),
              "pyproject.toml": project_version,
          }

          dot_version = component / ".version"
          if dot_version.exists():
              versions[".version"] = dot_version.read_text().strip()

          mismatches = {name: value for name, value in versions.items() if value != manifest_version}
          if mismatches:
              details = ", ".join(f"{name}={value}" for name, value in mismatches.items())
              raise SystemExit(f"Version mismatch (expected {manifest_version}): {details}")

          claude = Path("CLAUDE.md")
          if claude.exists() and f"Current Integration Version**: `{manifest_version}`" not in claude.read_text():
              raise SystemExit(f"CLAUDE.md does not document version {manifest_version}")

          print(f"All version sources match: {manifest_version}")
          PY

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            tox-env: py312
            allow-prereleases: false
          - python-version: '3.13'
            tox-env: py313
            allow-prereleases: false
          - python-version: '3.14'
            tox-env: py314
            allow-prereleases: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            tox.ini

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tox (${{ matrix.tox-env }})
        run: tox -e ${{ matrix.tox-env }}

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  dev-release:
    name: Publish validated dev release
    needs: [changes, versions, tests, hassfest, hacs]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine dev version
        id: release
        run: |
          VERSION=$(python -c "import json; print(json.load(open('custom_components/violet_pool_controller/manifest.json'))['version'])")
          VERSION="${VERSION%%-dev*}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION}-dev.${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Patch package version
        env:
          DEV_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          DEV_VERSION="${DEV_VERSION#v}"
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$DEV_VERSION\"|" custom_components/violet_pool_controller/manifest.json
          sed -i "s|^INTEGRATION_VERSION = .*|INTEGRATION_VERSION = \"$DEV_VERSION\"|" custom_components/violet_pool_controller/const.py
          printf '%s\n' "$DEV_VERSION" > custom_components/violet_pool_controller/.version

      - name: Build package and release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python scripts/build_release.py

          LAST_STABLE=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          {
            echo "## $TAG — Validated dev build"
            echo
            echo "> Automated test build from commit \`${{ github.sha }}\`. Not intended for production use."
            echo
            echo "### Changes"
            echo
            if [ -n "$LAST_STABLE" ]; then
              git log "${LAST_STABLE}..HEAD" --pretty=format:'- %s (%h)'
              echo
            else
              git log -30 --pretty=format:'- %s (%h)'
              echo
            fi
            echo
            echo "Install through HACS with beta releases enabled, or download \`violet_pool_controller.zip\`."
          } > dev-release-notes.md

      - name: Publish dev release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          prerelease: true
          draft: false
          make_latest: false
          body_path: dev-release-notes.md
          fail_on_unmatched_files: true
          files: |
            violet_pool_controller.zip
            violet_pool_controller.zip.sha256

      - name: Remove superseded dev releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag --list "v${VERSION}-dev.*" | while read -r old_tag; do
            [ -z "$old_tag" ] && continue
            [ "$old_tag" = "$CURRENT_TAG" ] && continue
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

      - name: Add release summary
        run: |
          {
            echo "## Dev release published"
            echo
            echo "[${{ steps.release.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }})"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Validation summary
    needs: [versions, tests, hassfest, hacs, dev-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## Validation results"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Versions | ${{ needs.versions.result }} |"
            echo "| Tests | ${{ needs.tests.result }} |"
            echo "| Hassfest | ${{ needs.hassfest.result }} |"
            echo "| HACS | ${{ needs.hacs.result }} |"
            echo "| Dev release | ${{ needs.dev-release.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
