name: Validate Integration

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/violet_pool_controller/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'CLAUDE.md'
      - 'hacs.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tox.ini'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a validation that a release is waiting on: release.yml calls
  # this workflow, and a re-run of the same tag would otherwise cancel the
  # in-flight release gate.
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare all version sources
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          component = Path("custom_components/violet_pool_controller")
          manifest_version = json.loads((component / "manifest.json").read_text())["version"]

          const_text = (component / "const.py").read_text()
          const_match = re.search(r'^INTEGRATION_VERSION = "([^"]+)"$', const_text, re.MULTILINE)
          if const_match is None:
              raise SystemExit("INTEGRATION_VERSION is missing from const.py")

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          versions = {
              "manifest.json": manifest_version,
              "const.py": const_match.group(1),
              "pyproject.toml": project_version,
          }

          dot_version = component / ".version"
          if dot_version.exists():
              versions[".version"] = dot_version.read_text().strip()

          mismatches = {name: value for name, value in versions.items() if value != manifest_version}
          if mismatches:
              details = ", ".join(f"{name}={value}" for name, value in mismatches.items())
              raise SystemExit(f"Version mismatch (expected {manifest_version}): {details}")

          claude = Path("CLAUDE.md")
          if claude.exists() and f"Current Integration Version**: `{manifest_version}`" not in claude.read_text():
              raise SystemExit(f"CLAUDE.md does not document version {manifest_version}")

          print(f"All version sources match: {manifest_version}")
          PY

  tests:
    # py312/py313 install ruff only and run `ruff check`; the test suite,
    # mypy and coverage need the installed Home Assistant and therefore run
    # on py314 alone. The matrix label says which of the two a leg is.
    name: ${{ matrix.label }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            tox-env: py312
            label: Lint
            allow-prereleases: false
          - python-version: '3.13'
            tox-env: py313
            label: Lint
            allow-prereleases: false
          - python-version: '3.14'
            tox-env: py314
            label: Lint, types and tests
            allow-prereleases: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            tox.ini

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tox (${{ matrix.tox-env }})
        run: tox -e ${{ matrix.tox-env }}

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned to master HEAD: home-assistant/actions has no maintained
      # release tags (the only tag, 1.0.0, dates from 2020).
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb  # master @ 2026-08-03

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration

  summary:
    name: Validation summary
    needs: [versions, tests, hassfest, hacs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## Validation results"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Versions | ${{ needs.versions.result }} |"
            echo "| Tests | ${{ needs.tests.result }} |"
            echo "| Hassfest | ${{ needs.hassfest.result }} |"
            echo "| HACS | ${{ needs.hacs.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
