name: HA Dev Early Warning Test

# Temporarily disabled (scheduled runs) because pytest-homeassistant-custom-component
# is incompatible with the current HA dev branch: the plugin patches
# homeassistant.components.http.start_http_server_and_save_config, which was
# renamed/removed in HA dev, so all 479 tests fail at setup.
#
# Re-enable the cron schedule once pytest-homeassistant-custom-component ships a
# release that supports the HA dev branch. workflow_dispatch stays available so
# the check can be triggered manually to test compatibility at any time.
on:
  # schedule:
  #   - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  ha-dev-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install dependencies with HA Dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install git+https://github.com/home-assistant/core.git@dev

      - name: Run Pytest Suite
        run: |
          pytest tests/
