name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "site.css"
      - "site.js"
      - ".nojekyll"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/docs.css"
      - "docs/wiki/**"
      - "custom_components/violet_pool_controller/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          mkdir -p _site/docs _site/custom_components/violet_pool_controller/brand
          cp index.html site.css site.js .nojekyll _site/
          cp docs/index.html docs/app.js docs/docs.css _site/docs/
          cp -R docs/wiki _site/docs/wiki
          cp custom_components/violet_pool_controller/brand/icon.png _site/custom_components/violet_pool_controller/brand/icon.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
