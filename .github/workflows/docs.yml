name: Publish Documentation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site.css'
      - 'site.js'
      - '.nojekyll'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/docs.css'
      - 'docs/wiki/**'
      - 'custom_components/violet_pool_controller/brand/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-wiki-changes:
    name: Detect wiki changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^docs/wiki/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Build static site
        run: |
          mkdir -p _site/docs _site/custom_components/violet_pool_controller/brand
          cp index.html site.css site.js .nojekyll _site/
          cp docs/index.html docs/app.js docs/docs.css _site/docs/
          cp -R docs/wiki _site/docs/wiki
          cp custom_components/violet_pool_controller/brand/icon.png \
            _site/custom_components/violet_pool_controller/brand/icon.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    name: Sync GitHub Wiki
    needs: detect-wiki-changes
    if: needs.detect-wiki-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Clone wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Replace wiki pages from source
        run: |
          find /tmp/wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/wiki/

      - name: Commit wiki changes
        working-directory: /tmp/wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No wiki changes to publish.'
          else
            git commit -m 'docs: sync wiki from docs/wiki [skip ci]'
            git push
          fi
