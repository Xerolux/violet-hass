name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Semantic version tag, for example v2.3.0 or v2.3.0-beta.2'
        required: true
        type: string
      draft:
        description: 'Create or update a draft release'
        required: false
        type: boolean
        default: false
      make_latest:
        description: 'Mark a stable release as latest'
        required: false
        type: boolean
        default: true
      post_to_forum:
        description: 'Post the release announcement to poolsteuerung.de'
        required: false
        type: boolean
        default: false
      forum_dry_run:
        description: 'Print the forum post without submitting it'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    uses: ./.github/workflows/validate.yml
    # The reusable validate.yml declares jobs that require contents: write
    # (dev-release via softprops/action-gh-release). GitHub requires the
    # caller to grant permissions at least as permissive as the callee, or
    # the workflow fails with startup_failure before any job runs.
    permissions:
      contents: write

  publish:
    name: Publish release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_type: ${{ steps.metadata.outputs.release_type }}
      previous_tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
            DRAFT="${{ inputs.draft }}"
            MAKE_LATEST="${{ inputs.make_latest }}"
          else
            TAG="${{ github.ref_name }}"
            DRAFT=false
            MAKE_LATEST=true
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid semantic version tag: $TAG" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            WORKFLOW_SHA=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if [ "$TAG_SHA" != "$WORKFLOW_SHA" ]; then
              echo "Existing tag $TAG points to $TAG_SHA, not workflow commit $WORKFLOW_SHA" >&2
              exit 1
            fi
          fi

          VERSION="${TAG#v}"
          IS_PRERELEASE=false
          RELEASE_TYPE=stable
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            MAKE_LATEST=false
            case "$VERSION" in
              *-alpha.*) RELEASE_TYPE=alpha ;;
              *-beta.*) RELEASE_TYPE=beta ;;
              *-rc.*) RELEASE_TYPE=rc ;;
              *) RELEASE_TYPE=prerelease ;;
            esac
          fi
          if [ "$DRAFT" = true ]; then
            MAKE_LATEST=false
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "release_type=$RELEASE_TYPE"
            echo "draft=$DRAFT"
            echo "make_latest=$MAKE_LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: Verify repository version
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path
          import os

          expected = os.environ["RELEASE_VERSION"]
          component = Path("custom_components/violet_pool_controller")
          manifest = json.loads((component / "manifest.json").read_text())["version"]
          const_text = (component / "const.py").read_text()
          const_match = re.search(r'^INTEGRATION_VERSION = "([^"]+)"$', const_text, re.MULTILINE)
          with Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)["project"]["version"]

          actual = {
              "manifest.json": manifest,
              "const.py": const_match.group(1) if const_match else "<missing>",
              "pyproject.toml": project,
          }
          dot_version = component / ".version"
          if dot_version.exists():
              actual[".version"] = dot_version.read_text().strip()

          mismatches = {name: value for name, value in actual.items() if value != expected}
          if mismatches:
              details = ", ".join(f"{name}={value}" for name, value in mismatches.items())
              raise SystemExit(f"Tag version {expected} does not match: {details}")

          print(f"Release sources match {expected}")

          # The changelog section IS the release text (see "Create release
          # preamble" below). Without it the release page would carry nothing
          # but the auto-generated pull request list.
          heading = f"## Version {expected} "
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not any(line.startswith(heading) for line in changelog.splitlines()):
              raise SystemExit(
                  f"CHANGELOG.md has no '## Version {expected} (YYYY-MM-DD)' section. "
                  "Add one - it becomes the release notes."
              )
          print(f"Changelog section for {expected} found")
          PY

      - name: Find previous release tag
        id: previous
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            | grep -Ev -- '-(dev|feature)[.-]' \
            | grep -Fxv "$TAG" \
            | head -1 || true)
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Build release package
        run: python scripts/build_release.py

      - name: Create release preamble
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TYPE: ${{ steps.metadata.outputs.release_type }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          version = os.environ["RELEASE_VERSION"]
          release_type = os.environ["RELEASE_TYPE"]

          # Lift this version's section out of the changelog. It was already
          # verified to exist, so the notes describe what actually changed
          # instead of leaving readers with a list of pull request titles.
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"## Version {version} "
          start = next(index for index, line in enumerate(lines) if line.startswith(heading))
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          # Drop the heading itself - the release is already titled with the tag.
          section = "\n".join(lines[start + 1 : end]).strip()

          parts = [f"## {tag} — Violet Pool Controller"]
          if release_type != "stable":
              parts.append(
                  "> **Pre-release:** This build is intended for testing before production use."
              )
          parts.append(section)
          parts.append(
              "### Installation\n\n"
              "Über HACS aktualisieren, oder `violet_pool_controller.zip` für eine "
              "manuelle Installation herunterladen."
          )
          parts.append(
              "### Unterstützung\n\n"
              "Diese Integration entsteht in meiner Freizeit. Wenn sie dir hilft, "
              "freue ich mich über Unterstützung:\n\n"
              "- [Buy Me A Coffee](https://buymeacoffee.com/xerolux)\n"
              "- [PayPal](https://paypal.me/xerolux)"
          )

          Path("release-preamble.md").write_text("\n\n".join(parts) + "\n", encoding="utf-8")
          print(f"Release notes built from the changelog section ({len(section)} characters)")
          PY

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Violet Pool Controller ${{ steps.metadata.outputs.tag }}
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.metadata.outputs.draft }}
          prerelease: ${{ steps.metadata.outputs.is_prerelease }}
          make_latest: ${{ steps.metadata.outputs.make_latest }}
          generate_release_notes: true
          previous_tag: ${{ steps.previous.outputs.tag }}
          body_path: release-preamble.md
          fail_on_unmatched_files: true
          files: |
            violet_pool_controller.zip
            violet_pool_controller.zip.sha256

      - name: Add release summary
        run: |
          {
            echo "## Release published"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.metadata.outputs.tag }}\` |"
            echo "| Type | ${{ steps.metadata.outputs.release_type }} |"
            echo "| Draft | ${{ steps.metadata.outputs.draft }} |"
            echo "| Latest | ${{ steps.metadata.outputs.make_latest }} |"
            echo "| Release | [Open](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.metadata.outputs.tag }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  forum:
    name: Forum announcement
    needs: publish
    if: inputs.post_to_forum == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install forum client dependency
        run: python -m pip install requests

      - name: Create forum announcement
        env:
          FORUM_URL: ${{ secrets.FORUM_URL }}
          FORUM_USERNAME: ${{ secrets.FORUM_USERNAME }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
          FORUM_TOPIC_ID: ${{ secrets.FORUM_TOPIC_ID }}
          VERSION: ${{ needs.publish.outputs.version }}
          TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_TYPE: ${{ needs.publish.outputs.release_type }}
          PREVIOUS_TAG: ${{ needs.publish.outputs.previous_tag }}
        run: |
          CHANGELOG_BASE="$PREVIOUS_TAG"
          if [ -z "$CHANGELOG_BASE" ]; then
            CHANGELOG_BASE="$TAG"
          fi

          ARGS=(
            --forum-url "$FORUM_URL"
            --username "$FORUM_USERNAME"
            --password "$FORUM_PASSWORD"
            --topic-id "$FORUM_TOPIC_ID"
            --version "$VERSION"
            --tag "$TAG"
            --release-type "$RELEASE_TYPE"
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
            --changelog-url "${{ github.server_url }}/${{ github.repository }}/compare/$CHANGELOG_BASE...$TAG"
            --download-url "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/violet_pool_controller.zip"
          )
          if [ "${{ inputs.forum_dry_run }}" = true ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/forum_poster.py "${ARGS[@]}"
