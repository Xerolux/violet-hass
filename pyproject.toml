[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "violet-hass"
version = "2.2.3-beta.1"
description = "Home Assistant integration + API client for Violet pool controllers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

[project.optional-dependencies]
api = ["violet-poolController-api"]
dev = [
    "violet-poolController-api[test]",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-homeassistant-custom-component>=0.13.337",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 100
# Home Assistant 2026.5.x runs on Python 3.14; target its syntax for the integration.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM"]
extend-select = ["T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Live hardware check scripts use print() for CLI output
"tests/live_*_check.py" = ["T201"]

[tool.mypy]
# Home Assistant 2026.5.x uses Python 3.14 syntax (e.g. except expressions without
# parentheses). Set the integration check target to 3.14 so mypy can parse HA.
python_version = "3.14"
warn_return_any = true
disallow_untyped_defs = false
warn_unused_configs = true
mypy_path = "violet_poolcontroller_api"
explicit_package_bases = true

[[tool.mypy.overrides]]
# The standalone API package still supports Python 3.12+; run mypy on it from
# its own directory so its pyproject.toml (target 3.12) takes effect.
module = "violet_poolcontroller_api.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/violet_pool_controller"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
