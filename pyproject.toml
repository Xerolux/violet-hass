[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "violet-hass"
version = "2.7.2"
description = "Home Assistant integration + API client for Violet pool controllers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

[project.optional-dependencies]
api = ["violet-poolController-api"]
# No "dev" extra on purpose: tox sets `package = skip`, so an extra declared
# here would never be installed. requirements-dev.txt is the single source of
# truth for dev-tool version floors.

[tool.ruff]
line-length = 100
# Home Assistant 2026.8+ runs on Python 3.14; target its syntax for the integration.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM"]
extend-select = ["T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Live hardware check scripts use print() for CLI output
"scripts/live/*.py" = ["T201"]

[tool.mypy]
# Home Assistant 2026.8+ uses Python 3.14 syntax (e.g. except expressions without
# parentheses). Set the integration check target to 3.14 so mypy can parse HA.
python_version = "3.14"
# No mypy_path: the API package is resolved from the installed distribution,
# which ships py.typed. Pointing mypy at a sibling checkout made CI and local
# runs type-check different code.
warn_return_any = true
disallow_untyped_defs = false
warn_unused_configs = true

[tool.coverage.run]
source = ["custom_components/violet_pool_controller"]
branch = true

[tool.coverage.report]
show_missing = true
# Measured, not guessed: a full green run (1421 tests) reports 64.48%.
# The floor sits a little below that so an ordinary refactor does not break
# CI, and well above the old 40 - which was set when the suite could not even
# be collected and was never a real gate. Raise this as tests are added;
# never lower it to make a build pass.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
