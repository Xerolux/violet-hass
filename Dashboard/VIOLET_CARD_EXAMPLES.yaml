# Violet Pool Card - dashboard examples
# This file shows several configuration examples for the Violet Pool Card
#
# NOTE:
# - These examples require the "Violet Pool Card" - a standalone
#   Lovelace card that is NOT part of this integration:
#   https://github.com/Xerolux/violet-pool-card
#   Install through HACS -> Frontend -> Custom repositories
#   (category "Dashboard"), see the wiki page "Dashboards & Pool Cards".
# - Without that card, use the other dashboards in this folder,
#   which only need built-in cards.
# - Replace "violet_pool_controller" with your own device name
#
# VERSION: 1.0.5 (2026-04-22)
# ============================================================================

# ============================================================================
# INDIVIDUAL CARDS - detailed control
# ============================================================================

# --- Pump Card ---
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_pump
  card_type: pump
  name: Pool pump
  show_state: true
  show_detail_status: true
  show_controls: true
  show_runtime: true

# --- Heater Card ---
- type: custom:violet-pool-card
  entity: climate.violet_pool_controller_heater
  card_type: heater
  name: Pool heater
  show_state: true
  show_detail_status: true
  show_controls: true

# --- Solar Card ---
- type: custom:violet-pool-card
  entity: climate.violet_pool_controller_solar
  card_type: solar
  name: Solar heater
  show_state: true
  show_detail_status: true
  show_controls: true

# --- Chlorine dosing Card ---
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_dos_1_cl
  card_type: dosing
  dosing_type: chlorine
  name: Chlorine dosing
  show_state: true
  show_detail_status: true
  show_controls: true
  show_history: true

# --- pH- Dosing Card ---
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_dos_4_phm
  card_type: dosing
  dosing_type: ph_minus
  name: pH- Dosing
  show_state: true
  show_detail_status: true
  show_controls: true

# --- pH+ Dosing Card ---
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_dos_5_php
  card_type: dosing
  dosing_type: ph_plus
  name: pH+ Dosing
  show_state: true
  show_detail_status: true
  show_controls: true

# --- Flocculation Card ---
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_dos_6_floc
  card_type: dosing
  dosing_type: flocculant
  name: Flocculation
  show_state: true
  show_detail_status: true
  show_controls: true

# ============================================================================
# OVERVIEW CARD - everything at a glance
# ============================================================================

- type: custom:violet-pool-card
  card_type: overview
  entities:
    # Main devices
    - switch.violet_pool_controller_pump
    - climate.violet_pool_controller_heater
    - climate.violet_pool_controller_solar
    # Dosing channels
    - switch.violet_pool_controller_dos_1_cl
    - switch.violet_pool_controller_dos_4_phm
    - switch.violet_pool_controller_dos_5_php
    # Sensors
    - sensor.violet_pool_controller_pool_temperature
    - sensor.violet_pool_ph_value
    - sensor.violet_pool_orp_value
    - sensor.violet_pool_controller_chlorine_level

# ============================================================================
# COMPACT CARDS - dashboard overview
# ============================================================================

# Compact view - every device in one card
- type: vertical-stack
  cards:
    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_pump
      card_type: compact
      show_controls: false

    - type: custom:violet-pool-card
      entity: climate.violet_pool_controller_heater
      card_type: compact
      show_controls: false

    - type: custom:violet-pool-card
      entity: climate.violet_pool_controller_solar
      card_type: compact
      show_controls: false

    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_1_cl
      card_type: compact
      show_controls: false

    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_4_phm
      card_type: compact
      show_controls: false

# ============================================================================
# DASHBOARD LAYOUTS - different views
# ============================================================================

# --- Layout 1: horizontal - main devices ---
- type: horizontal-stack
  cards:
    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_pump
      card_type: pump

    - type: custom:violet-pool-card
      entity: climate.violet_pool_controller_heater
      card_type: heater

    - type: custom:violet-pool-card
      entity: climate.violet_pool_controller_solar
      card_type: solar

# --- Layout 2: grid - all dosing channels ---
- type: grid
  columns: 2
  square: false
  cards:
    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_1_cl
      card_type: dosing
      dosing_type: chlorine

    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_4_phm
      card_type: dosing
      dosing_type: ph_minus

    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_5_php
      card_type: dosing
      dosing_type: ph_plus

    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_6_floc
      card_type: dosing
      dosing_type: flocculant

# --- Layout 3: complete pool dashboard ---
- type: vertical-stack
  cards:
    # Overview at the top
    - type: custom:violet-pool-card
      card_type: overview
      entities:
        - switch.violet_pool_controller_pump
        - climate.violet_pool_controller_heater
        - climate.violet_pool_controller_solar
        - switch.violet_pool_controller_dos_1_cl
        - switch.violet_pool_controller_dos_4_phm
        - switch.violet_pool_controller_dos_5_php
        - sensor.violet_pool_controller_pool_temperature
        - sensor.violet_pool_ph_value
        - sensor.violet_pool_orp_value

    # Main device controls
    - type: horizontal-stack
      cards:
        - type: custom:violet-pool-card
          entity: switch.violet_pool_controller_pump
          card_type: pump

        - type: custom:violet-pool-card
          entity: climate.violet_pool_controller_heater
          card_type: heater

    # Dosing grid
    - type: grid
      columns: 3
      cards:
        - type: custom:violet-pool-card
          entity: switch.violet_pool_controller_dos_1_cl
          card_type: dosing
          dosing_type: chlorine

        - type: custom:violet-pool-card
          entity: switch.violet_pool_controller_dos_4_phm
          card_type: dosing
          dosing_type: ph_minus

        - type: custom:violet-pool-card
          entity: switch.violet_pool_controller_dos_5_php
          card_type: dosing
          dosing_type: ph_plus

# ============================================================================
# ADVANCED CONFIGURATION - custom styling
# ============================================================================

# Card with custom colours
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_pump
  card_type: pump
  accent_color: "#00bcd4"  # Cyan
  icon_color: "#ff9800"    # Orange

# Card with tap actions
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_pump
  card_type: pump
  tap_action:
    action: more-info
  hold_action:
    action: call-service
    service: violet_pool_controller.control_pump
    service_data:
      entity_id: switch.violet_pool_controller_pump
      action: "auto"
  double_tap_action:
    action: toggle

# ============================================================================
# MOBILE OPTIMISED - compact views
# ============================================================================

# Mobile dashboard - vertical stack
- type: vertical-stack
  cards:
    # Overview right at the top
    - type: custom:violet-pool-card
      card_type: overview

    # Key devices in compact mode
    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_pump
      card_type: compact

    - type: custom:violet-pool-card
      entity: climate.violet_pool_controller_heater
      card_type: compact

    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_1_cl
      card_type: compact

# ============================================================================
# CONDITIONAL CARDS - shown only in certain states
# ============================================================================

# Show the heater card only when active or blocked
- type: conditional
  conditions:
    - entity: climate.violet_pool_controller_heater
      state_not: "off"
  card:
    type: custom:violet-pool-card
    entity: climate.violet_pool_controller_heater
    card_type: heater

# Show a warning when chlorine is low
- type: conditional
  conditions:
    - entity: sensor.violet_pool_orp_value
      state_below: 650
  card:
    type: custom:violet-pool-card
    entity: switch.violet_pool_controller_dos_1_cl
    card_type: dosing
    dosing_type: chlorine

# ============================================================================
# PICTURE ELEMENTS - card embedded in an image
# ============================================================================

- type: picture-elements
  image: /local/pool-background.jpg
  elements:
    # Pump position
    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_pump
      card_type: compact
      style:
        top: 20%
        left: 10%
        width: 80%

    # Heater position
    - type: custom:violet-pool-card
      entity: climate.violet_pool_controller_heater
      card_type: compact
      style:
        top: 40%
        left: 10%
        width: 80%

    # Water chemistry position
    - type: custom:violet-pool-card
      entity: switch.violet_pool_controller_dos_1_cl
      card_type: compact
      style:
        top: 60%
        left: 10%
        width: 80%

# ============================================================================
# CUSTOM THEMES - fitting in with an existing theme
# ============================================================================

# With the Google Dark theme
- type: custom:violet-pool-card
  entity: switch.violet_pool_controller_pump
  card_type: pump
  theme: Google Dark Theme

# With the iOS Light theme
- type: custom:violet-pool-card
  entity: climate.violet_pool_controller_heater
  card_type: heater
  theme: iOS Light Mode

