# =============================================================================
# Violet Pool Controller - compact dashboard card
# =============================================================================
#
# This configuration builds a compact dashboard card with the
# most important controls for your pool.
#
# BEST FOR: mobile devices, overview pages, tablets
#
# VERSION: 1.0.5 (2026-04-22)
# =============================================================================

type: entities
title: 🏊 Pool controller
show_header_toggle: false
state_color: true
entities:
  # Quick controls
  - type: section
    label: Control
  - entity: switch.violet_pool_controller_pump
    name: Pump
    icon: mdi:water-pump
  - entity: number.violet_pool_controller_pump_speed
    name: Speed
  - entity: switch.violet_pool_controller_heater
    name: Heater
    icon: mdi:radiator
  - entity: number.violet_pool_controller_heater_target_temp
    name: Target temp.

  # Water quality
  - type: section
    label: Water quality
  - entity: sensor.violet_pool_controller_ph_value
    name: pH
    icon: mdi:flask
  - entity: sensor.violet_pool_controller_orp_value
    name: ORP
    icon: mdi:flash
  - entity: sensor.violet_pool_controller_pool_temperature
    name: Temperature
    icon: mdi:thermometer-water

  # Status
  - type: section
    label: Status
  - entity: binary_sensor.violet_pool_controller_connection
    name: Connection
    icon: mdi:lan-connect
