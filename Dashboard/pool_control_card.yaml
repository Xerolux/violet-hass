# =============================================================================
# Violet Pool Controller - Dashboard Card Configuration
# =============================================================================
#
# This configuration builds a clear dashboard card for the
# full control and monitoring of your pool controller.
#
# INSTALLATION:
# 1. Open your Home Assistant dashboard in edit mode
# 2. Add a new card (Add card)
# 3. Choose "Manual" or "Code editor"
# 4. Kopieren Sie diese Konfiguration und passen Sie entity_ids an
# 5. Save the card
#
# NOTE: 
# - Replace "violet_pool_controller" with your own device name
#   (default: "violet_pool_controller" -> entity id prefix)
# - With several controllers, or after renaming one:
#   Developer tools -> States -> search for "violet"
#
# VERSION: 1.0.5 (2026-04-22)
# =============================================================================

type: vertical-stack
cards:
  # =============================================================================
  # MAIN CONTROLS (pump, heater, solar)
  # =============================================================================
  - type: entities
    title: 🏊 Pool control
    show_header_toggle: false
    entities:
      # Pump - Mode & Speed
      - type: section
        label: Filter pump
      - entity: switch.violet_pool_controller_pump
        name: Mode
        icon: mdi:water-pump
      - entity: number.violet_pool_controller_pump_speed
        name: Speed
        icon: mdi:speedometer
      - entity: sensor.violet_pool_controller_pump_runtime
        name: Runtime
        icon: mdi:clock-outline

      # Heater - mode & temperaturee
      - type: section
        label: Heater
      - entity: switch.violet_pool_controller_heater
        name: Mode
        icon: mdi:radiator
      - entity: number.violet_pool_controller_heater_target_temp
        name: Target temperature
        icon: mdi:thermometer
      - entity: sensor.violet_pool_controller_pool_temperature
        name: Current temperature
        icon: mdi:thermometer-water

      # Solar - mode & temperaturee
      - type: section
        label: Solar absorber
      - entity: switch.violet_pool_controller_solar
        name: Mode
        icon: mdi:solar-power
      - entity: number.violet_pool_controller_solar_target_temp
        name: Target temperature
        icon: mdi:thermometer
      - entity: sensor.violet_pool_controller_solar_temperature
        name: Collector temperature
        icon: mdi:thermometer-lines

  # =============================================================================
  # WATER QUALITY
  # =============================================================================
  - type: entities
    title: 💧 Water quality
    show_header_toggle: false
    entities:
      # pH control
      - type: section
        label: pH value
      - entity: sensor.violet_pool_controller_ph_value
        name: Current pH
        icon: mdi:flask
      - entity: number.violet_pool_controller_ph_setpoint
        name: Setpoint
        icon: mdi:flask-outline
      - entity: switch.violet_pool_controller_dos_4_phm
        name: pH- mode
        icon: mdi:flask-minus
      - entity: switch.violet_pool_controller_dos_5_php
        name: pH+ mode
        icon: mdi:flask-plus

      # Chlorine control
      - type: section
        label: Disinfection
      - entity: sensor.violet_pool_controller_orp_value
        name: ORP (redox)
        icon: mdi:flash
      - entity: number.violet_pool_controller_orp_setpoint
        name: ORP Setpoint
        icon: mdi:flash-outline
      - entity: sensor.violet_pool_controller_chlorine_level
        name: Chlorine
        icon: mdi:test-tube
      - entity: number.violet_pool_controller_chlorine_setpoint
        name: Chlorine setpoint
        icon: mdi:test-tube-empty
      - entity: switch.violet_pool_controller_dos_1_cl
        name: Chlorine dosing mode
        icon: mdi:test-tube

  # =============================================================================
  # TEMPERATURE OVERVIEW
  # =============================================================================
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.violet_pool_controller_pool_temperature
        name: Pool
        min: 10
        max: 35
        severity:
          green: 24
          yellow: 20
          red: 10
        needle: true

      - type: gauge
        entity: sensor.violet_pool_controller_solar_temperature
        name: Solar
        min: 10
        max: 60
        severity:
          green: 30
          yellow: 20
          red: 10
        needle: true

      - type: gauge
        entity: sensor.violet_pool_controller_ambient_temperature
        name: Outdoor
        min: -10
        max: 40
        severity:
          green: 15
          yellow: 5
          red: -10
        needle: true

  # =============================================================================
  # WATER CHEMISTRY GRAPH
  # =============================================================================
  - type: history-graph
    title: 📊 Water chemistry (24h)
    hours_to_show: 24
    refresh_interval: 300
    entities:
      - entity: sensor.violet_pool_controller_ph_value
        name: pH
      - entity: sensor.violet_pool_controller_orp_value
        name: ORP
      - entity: sensor.violet_pool_controller_chlorine_level
        name: Chlorine

  # =============================================================================
  # ADVANCED CONTROL (optional)
  # =============================================================================
  - type: entities
    title: ⚙️ Advanced control
    show_header_toggle: false
    entities:
      # Lighting
      - entity: switch.violet_pool_controller_light
        name: Lighting
        icon: mdi:lightbulb

      # PV surplus
      - entity: switch.violet_pool_controller_pvsurplus
        name: PV surplus
        icon: mdi:solar-power-variant

      # Cover (if fitted)
      - entity: cover.violet_pool_controller_cover
        name: Cover
        icon: mdi:window-shutter

  # =============================================================================
  # SYSTEM STATUS
  # =============================================================================
  - type: entities
    title: 🔧 System
    show_header_toggle: false
    state_color: true
    entities:
      - entity: binary_sensor.violet_pool_controller_connection
        name: Connection
        icon: mdi:lan-connect
      - entity: sensor.violet_pool_controller_error_code
        name: Error status
        icon: mdi:alert-circle
      - entity: sensor.violet_pool_controller_last_calibration
        name: Last calibration
        icon: mdi:wrench-clock
