# =============================================================================
# Violet Pool Controller - SIMPLE BLOCKS (no custom cards)
# =============================================================================
#
# This dashboard works WITHOUT any additional custom cards.
# Uses nothing but the built-in Home Assistant entities card.
#
# BEST FOR: a quick start, no dependencies, works everywhere
# =============================================================================

type: vertical-stack
cards:
  # ============================================================================
  # 🏊 FILTER PUMP
  # ============================================================================
  - type: entities
    title: 🏊 Filter pump
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.violet_pool_controller_pumpen_status
        name: Status
        icon: mdi:information-outline
      - entity: switch.violet_pool_controller_filterpumpe
        name: Mode
        icon: mdi:toggle-switch
      - entity: number.violet_pool_controller_pumpengeschwindigkeit
        name: Speed (1=ECO, 2=Normal, 3=Boost)
        icon: mdi:speedometer
      - entity: sensor.violet_pool_controller_pump_runtime
        name: Runtime today
        icon: mdi:timer-outline

  # ============================================================================
  # 🔥 HEATER
  # ============================================================================
  - type: entities
    title: 🔥 Heater
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.violet_pool_controller_heizungs_status
        name: Status
        icon: mdi:information-outline
      - entity: switch.violet_pool_controller_heizung
        name: Mode
        icon: mdi:toggle-switch
      - entity: number.violet_pool_controller_heizung_zieltemperatur
        name: Target temperature
        icon: mdi:thermometer-chevron-up
      - entity: sensor.violet_pool_controller_beckenwasser
        name: Current temperature
        icon: mdi:thermometer-water
      - entity: sensor.violet_pool_controller_heater_runtime
        name: Runtime today
        icon: mdi:timer-outline

  # ============================================================================
  # ☀️ SOLAR
  # ============================================================================
  - type: entities
    title: ☀️ Solar
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.violet_pool_controller_solar_status
        name: Status
        icon: mdi:information-outline
      - entity: switch.violet_pool_controller_solar
        name: Mode
        icon: mdi:toggle-switch
      - entity: number.violet_pool_controller_solar_zieltemperatur
        name: Target temperature
        icon: mdi:thermometer-chevron-up
      - entity: sensor.violet_pool_controller_solarabsorber
        name: Absorber temperature
        icon: mdi:solar-power
      - entity: sensor.violet_pool_controller_beckenwasser
        name: Pool temperature
        icon: mdi:thermometer-water
      - entity: sensor.violet_pool_controller_solar_runtime
        name: Runtime today
        icon: mdi:timer-outline

  # ============================================================================
  # 💧 pH CONTROL
  # ============================================================================
  - type: entities
    title: 💧 pH control
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.violet_pool_controller_ph_wert
        name: pH now
        icon: mdi:flask
      - entity: number.violet_pool_controller_ph_sollwert
        name: pH Setpoint
        icon: mdi:target

      - type: section
        label: pH minus (acid)
      - entity: switch.violet_pool_controller_ph_minus
        name: pH- mode
        icon: mdi:minus-circle
      - entity: number.violet_pool_controller_ph_minus_canister_volume
        name: pH- canister volume (ml)
        icon: mdi:barrel
      - entity: sensor.violet_pool_controller_dos_4_phm_remaining_range
        name: pH- Range
        icon: mdi:calendar-clock
      - entity: sensor.violet_pool_controller_dos_4_phm_runtime
        name: pH- Runtime
        icon: mdi:timer-outline

      - type: section
        label: pH plus (base)
      - entity: switch.violet_pool_controller_ph_plus
        name: pH+ mode
        icon: mdi:plus-circle
      - entity: number.violet_pool_controller_ph_plus_canister_volume
        name: pH+ canister volume (ml)
        icon: mdi:barrel
      - entity: sensor.violet_pool_controller_dos_5_php_remaining_range
        name: pH+ Range
        icon: mdi:calendar-clock
      - entity: sensor.violet_pool_controller_dos_5_php_runtime
        name: pH+ Runtime
        icon: mdi:timer-outline

  # ============================================================================
  # 🟢 CHLORINE CONTROL
  # ============================================================================
  - type: entities
    title: 🟢 Chlorine control
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.violet_pool_controller_chlorgehalt
        name: Chlorine now
        icon: mdi:test-tube
      - entity: number.violet_pool_controller_chlor_sollwert
        name: Chlorine setpoint
        icon: mdi:target
      - entity: sensor.violet_pool_controller_redoxpotential
        name: ORP now
        icon: mdi:flash
      - entity: number.violet_pool_controller_orp_setpoint
        name: ORP Setpoint
        icon: mdi:flash-outline

      - type: section
        label: Chlorine dosing
      - entity: switch.violet_pool_controller_chlor
        name: Chlorine mode
        icon: mdi:toggle-switch
      - entity: number.violet_pool_controller_chlorine_canister_volume
        name: Chlorine canister volume (ml)
        icon: mdi:barrel
      - entity: sensor.violet_pool_controller_dos_1_cl_remaining_range
        name: Chlorine range
        icon: mdi:calendar-clock
      - entity: sensor.violet_pool_controller_dos_1_cl_runtime
        name: Chlorine runtime
        icon: mdi:timer-outline

  # ============================================================================
  # 🌊 WATER LEVEL & BACKWASH (optional)
  # ============================================================================
  - type: entities
    title: 🌊 Water level & backwash
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.violet_pool_controller_ruckspul_status
        name: Backwash status
        icon: mdi:refresh
      - entity: switch.violet_pool_controller_ruckspulung
        name: Backwash mode
        icon: mdi:toggle-switch
      - entity: sensor.violet_pool_controller_uberlaufbehalter
        name: Water level
        icon: mdi:water-percent
      - entity: sensor.violet_pool_controller_filterdruck
        name: Filter pressure
        icon: mdi:gauge

# =============================================================================
# INSTALLATION:
# 1. Open Home Assistant
# 2. Overview -> top right menu -> Edit dashboard
# 3. Add card -> "Manual" at the very bottom
# 4. Paste this complete YAML
# 5. Save
#
# NOTES:
# - Adjust the entity_id names to your actual entity ids
# - Remove devices you do not have (for example solar, backwash)
# - Add further devices following the same pattern
# =============================================================================
