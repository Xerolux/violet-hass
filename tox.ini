[tox]
envlist = py312,py313,py314
skip_missing_interpreters = true

[testenv]
description = Run integration checks for the Home Assistant custom component
; The repo root is not an installable package (HA custom component monorepo);
; without this, tox tries to build it and setuptools flat-layout discovery fails.
package = skip
deps =
    ; py312/py313 are lint-only legs. They cannot install requirements-dev.txt
    ; because it pulls in Home Assistant, which requires Python >=3.14, so they
    ; take the newest ruff instead. requirements-dev.txt stays the single place
    ; that declares a ruff floor.
    py312,py313: ruff
    ; py314 is the full leg: lint, types and the test suite. Every version floor
    ; comes from requirements-dev.txt so tox and a local checkout install the
    ; same tools.
    py314: -r requirements-dev.txt
commands =
    ; Lint check on every interpreter.
    ; NOTE: ``ruff format --check`` is still omitted. The ruff 0.15.x bug that
    ; rewrote valid ``except (A, B):`` into invalid ``except A, B:`` is fixed as
    ; of ruff 0.16, but the tree has never been formatted: enabling the check
    ; today fails on 44 files. Re-enable it together with a one-off
    ; ``ruff format`` commit, not before.
    py312,py313,py314: ruff check custom_components/violet_pool_controller tests
    ; Static type check. Only on py314 because it needs the installed Home
    ; Assistant to resolve the framework imports.
    py314: mypy custom_components/violet_pool_controller
    ; Full test suite + coverage against the Home Assistant release the test
    ; harness pins. The coverage floor lives in pyproject.toml ([tool.coverage.report]
    ; fail_under) so that a local ``pytest --cov`` gates on the same number.
    py314: pytest tests/ -q \
        --cov=custom_components/violet_pool_controller \
        --cov-report=term-missing
