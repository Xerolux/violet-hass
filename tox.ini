[tox]
envlist = py312,py313,py314
skip_missing_interpreters = true

[testenv]
description = Run integration checks for the Home Assistant custom component
; The repo root is not an installable package (HA custom component monorepo);
; without this, tox tries to build it and setuptools flat-layout discovery fails.
package = skip
deps =
    ; Lint runs on all Python versions.
    py312,py313,py314: ruff>=0.15.0
    ; Tests + coverage run against the Home Assistant release the integration
    ; targets. Home Assistant 2026.6+ requires Python >=3.14.2, and
    ; pytest-homeassistant-custom-component >=0.13.317 requires Python >=3.14,
    ; so the test suite can only run on py314.
    py314: -r requirements.txt
    py314: pytest>=8.3.0
    py314: pytest-asyncio>=0.24.0
    py314: pytest-cov>=6.0.0
    ; 0.13.356 pins homeassistant==2026.8.2.
    py314: pytest-homeassistant-custom-component>=0.13.356
    ; tests import zeroconf (ZeroConf discovery); HA pulls it as a runtime dep
    ; but it must be installed explicitly here since requirements.txt has no -e dev install.
    py314: zeroconf
commands =
    ; Lint check on every interpreter.
    ; NOTE: ruff format --check is intentionally omitted because ruff 0.15.x
    ; has a bug that rewrites valid ``except (A, B):`` into invalid
    ; ``except A, B:``.  Re-enable once the upstream fix ships.
    py312,py313,py314: ruff check custom_components/violet_pool_controller tests
    ; Full test suite + coverage against Home Assistant 2026.8.
    py314: pytest tests/ -q \
        --cov=custom_components/violet_pool_controller \
        --cov-report=term-missing
