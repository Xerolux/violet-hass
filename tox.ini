[tox]
envlist = py312,py313,py314
skip_missing_interpreters = true

[testenv]
description = Run integration checks for the Home Assistant custom component
; The repo root is not an installable package (HA custom component monorepo);
; without this, tox tries to build it and setuptools flat-layout discovery fails.
package = skip
deps =
    ; Lint runs on all Python versions.
    py312,py313,py314: ruff>=0.15.0
    ; Tests + coverage only on stable interpreters that have wheels for
    ; pytest-homeassistant-custom-component (py314 is still experimental).
    py312,py313: -r requirements.txt
    py312,py313: pytest>=8.3.0
    py312,py313: pytest-asyncio>=0.24.0
    py312,py313: pytest-cov>=6.0.0
    py312,py313: pytest-homeassistant-custom-component>=0.13.337
commands =
    ; Lint check on every interpreter.
    ; NOTE: ruff format --check is intentionally omitted because ruff 0.15.x
    ; has a bug that rewrites valid ``except (A, B):`` into invalid
    ; ``except A, B:``.  Re-enable once the upstream fix ships.
    py312,py313,py314: ruff check custom_components/violet_pool_controller tests
    ; Full test suite + coverage on stable interpreters.
    py312,py313: pytest tests/ -q \
        --cov=custom_components/violet_pool_controller \
        --cov-report=term-missing
